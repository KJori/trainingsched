# Two training pages, each with its own data. Paste this into Dockge (or run `docker compose up -d`).
# Nothing else to fill in: the name, the coach and the history are set up in the page, under Settings.
#
# The app has no login of its own. Only expose it through an authenticating proxy (Pangolin, with auth on).
services:
  trainingsched-1:
    image: ghcr.io/kjori/trainingsched:latest
    container_name: trainingsched-1
    restart: unless-stopped
    volumes:
      - trainingsched-1:/data
    extra_hosts:
      - host.docker.internal:host-gateway   # lets the coach reach Ollama running on this server
    networks: [pangolin]
    # ports: ["8081:8080"]   # only to also open it on your LAN without Pangolin

  trainingsched-2:
    image: ghcr.io/kjori/trainingsched:latest
    container_name: trainingsched-2
    restart: unless-stopped
    volumes:
      - trainingsched-2:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [pangolin]
    # ports: ["8082:8080"]

volumes:
  trainingsched-1:
  trainingsched-2:

networks:
  pangolin:
    external: true   # the Docker network your Newt container is on; change the name if yours differs
